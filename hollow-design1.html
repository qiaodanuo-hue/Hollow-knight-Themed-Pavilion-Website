  <section id="gameword">
    <div id="linian">
      <p>展厅按照游戏内容的颁布顺序依次设计，设立了包括本体在内的5个不同风格展厅，并在展馆开篇设立了序厅，以及在展馆结尾设立了休闲体验区，同时结合游戏内容对全馆外观进行了整体构思与设计。</p>
      <p>展厅设计意在展现游戏的内容内核及制作设计，为游戏玩家提供现实交流平台，增加与游戏的实感共鸣，且通过展厅的浏览增加热度，为该工作室的续作推出做充分准备与预热。</p>
